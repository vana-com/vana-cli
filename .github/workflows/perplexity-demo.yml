name: Perplexity demo

on:
  push:
    branches: [main, develop]
    paths:
      - "examples/perplexity-demo/**"
      - "test/examples/perplexity-demo.test.ts"
      - "vitest.config.ts"
      - "src/server/**"
      - "src/core/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/perplexity-demo.yml"
  pull_request:
    paths:
      - "examples/perplexity-demo/**"
      - "test/examples/perplexity-demo.test.ts"
      - "vitest.config.ts"
      - "src/server/**"
      - "src/core/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/perplexity-demo.yml"

concurrency:
  group: perplexity-demo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      APP_URL: http://localhost:3090
      VANA_ENV: prod
      VANA_APP_ADDRESS: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      # Public Hardhat fixture identity. No hosted requests run during build.
      VANA_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test test/examples/perplexity-demo.test.ts test/examples/nextjs-starter.test.ts examples/perplexity-demo/src/components/ConnectFlow.test.js
      - run: pnpm --filter perplexity-demo build
