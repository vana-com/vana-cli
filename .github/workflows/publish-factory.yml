name: Publish Factory core

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
      - name: Download the licensed public package
        run: curl --fail --location --output vana-factory-core-0.0.7.tgz https://github.com/vana-com/vana-cli/releases/download/v0.47.0/vana-factory-core-0.0.7.tgz
      - name: Verify the reviewed artifact
        run: echo '107bdd0dbad63ab71a48ad3fe3ca70e058c146aae8c956a62186dde2f1471983  vana-factory-core-0.0.7.tgz' | sha256sum --check
      - name: Publish the exact artifact to npm
        run: npm publish ./vana-factory-core-0.0.7.tgz --ignore-scripts --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
