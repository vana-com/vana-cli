name: Publish Factory core

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
      - name: Download the licensed public package
        run: curl --fail --location --output vana-factory-core-0.0.4.tgz https://github.com/vana-com/vana-cli/releases/download/v0.47.0/vana-factory-core-0.0.4.tgz
      - name: Verify the reviewed artifact
        run: echo '090c41a6585b3412f94ca84560c6a55e7bf54cc66d81ecf2997a9a67f21d2a9e  vana-factory-core-0.0.4.tgz' | sha256sum --check
      - name: Publish the exact artifact to npm
        run: npm publish ./vana-factory-core-0.0.4.tgz --ignore-scripts --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
