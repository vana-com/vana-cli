branches: ["main"]
plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      releaseRules:
        - breaking: true
          release: minor
  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
  - - "@semantic-release/npm"
    # npm publish is off until vanaservices is an owner of the vana-cli
    # package (only tim_vana is today, publish 403s). Installs come from
    # GitHub release assets, so nothing user-facing depends on npm.
    - npmPublish: false
  - - "@semantic-release/git"
    - assets:
        - package.json
      message: "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"
  - - "@semantic-release/github"
    - assets:
        - path: artifacts/release/*.tar.gz
        - path: artifacts/release/*.tar.gz.sha256
        - path: artifacts/release/*.zip
        - path: artifacts/release/*.zip.sha256
