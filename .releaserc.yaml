branches: ["main"]
plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      releaseRules:
        - breaking: true
          release: minor
  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
  - - "@semantic-release/npm"
    # Version bump only. npm publish happens in its own workflow job after
    # the GitHub release exists, because semantic-release publishes to npm
    # before it creates the release, so an npm failure here costs users the
    # binaries. That is exactly what happened to v0.23.0 and v0.23.1.
    - npmPublish: false
  - - "@semantic-release/git"
    - assets:
        - package.json
      message: "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"
  - - "@semantic-release/github"
    - assets:
        - path: artifacts/release/*.tar.gz
        - path: artifacts/release/*.tar.gz.sha256
        - path: artifacts/release/*.zip
        - path: artifacts/release/*.zip.sha256
