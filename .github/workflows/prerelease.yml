name: Canary Release

on:
  push:
    branches:
      - dev
      - develop
      - "feat/**"
    paths-ignore:
      - "connect/**"
      - "examples/**"

permissions:
  contents: write

concurrency:
  group: canary-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  dev-npm:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:eslint
      - run: pnpm format:check
      - run: pnpm test
      - run: node scripts/set-dev-version.mjs
      - run: pnpm build
      - run: pnpm pack:check
      - run: npm publish --tag canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  build-sea:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            archive_format: tar.gz
            binary_name: vana
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            archive_format: tar.gz
            binary_name: vana
          - runner: macos-14
            platform: darwin
            arch: arm64
            archive_format: tar.gz
            binary_name: vana
          - runner: windows-2022
            platform: win32
            arch: x64
            archive_format: zip
            binary_name: vana.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26.12.1
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Set dev prerelease version
        if: github.ref_name == 'dev'
        run: node scripts/set-dev-version.mjs
      - run: pnpm clean
      - run: pnpm build
      - run: pnpm pack:check
      - name: Import Apple signing certificate (macOS)
        if: github.ref_name == 'dev' && matrix.platform == 'darwin'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_BUILD_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_ASC_API_KEY_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "Apple signing secrets are not available; the build will fall back to an ad-hoc signature."
            exit 0
          fi
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          API_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$APPLE_API_KEY" | base64 --decode -o $API_KEY_PATH
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$APPLE_CERTIFICATE_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> $GITHUB_ENV

      - run: pnpm build:sea -- --artifact-name vana-${{ matrix.platform }}-${{ matrix.arch }} --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --archive-format ${{ matrix.archive_format }} --binary-name ${{ matrix.binary_name }}
        env:
          # Quoted: the identity contains ": ", which YAML would otherwise
          # read as a mapping separator.
          APPLE_SIGNING_IDENTITY: "${{ github.ref_name == 'dev' && matrix.platform == 'darwin' && secrets.APPLE_TEAM_ID != '' && format('Developer ID Application: Corsali, Inc ({0})', secrets.APPLE_TEAM_ID) || '' }}"
          APPLE_API_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_ASC_API_KEY_ISSUER_UUID }}
      - run: pnpm sea:check -- --artifact-dir artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }} --archive artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive_format }} --checksum artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive_format }}.sha256 --platform ${{ matrix.platform }} --binary-name ${{ matrix.binary_name }}
      - uses: actions/upload-artifact@v7
        with:
          name: vana-sea-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }}
            artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive_format }}
            artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive_format }}.sha256
  demo-preview:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26.12.1
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm clean
      - run: pnpm build
      - run: pnpm build:sea -- --artifact-name vana-linux-x64 --platform linux --arch x64 --archive-format tar.gz --binary-name vana
      - run: pnpm demo:transcripts
      - run: pnpm demo:vhs
      - uses: actions/upload-artifact@v7
        with:
          name: vana-demo-preview
          path: |
            docs/transcripts
            docs/vhs
  canary:
    needs: [build-sea, demo-preview]
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26.12.1
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Set dev prerelease version
        if: github.ref_name == 'dev'
        run: node scripts/set-dev-version.mjs
      - run: pnpm clean
      - run: pnpm build
      - run: pnpm pack:check
      - name: Publish canary
        if: github.ref_name != 'dev'
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" = "dev" ]; then
            node scripts/set-dev-version.mjs
          else
            npm version "${VERSION}-canary.${SHORT_SHA}" --no-git-tag-version
          fi
          npm publish --tag canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: vana-sea-*
          path: artifacts/release
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: vana-demo-preview
          path: artifacts/demo-preview
      - name: Generate package-manager metadata
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          BRANCH_SLUG=$(printf "%s" "$GITHUB_REF_NAME" | tr '/_' '-' | tr -cd '[:alnum:]-')
          TAG="canary-${BRANCH_SLUG}"
          pnpm package-managers:generate -- --release-tag "$TAG" --package-version "$PACKAGE_VERSION"
      - name: Publish branch prerelease assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_SLUG=$(printf "%s" "$GITHUB_REF_NAME" | tr '/_' '-' | tr -cd '[:alnum:]-')
          TAG="canary-${BRANCH_SLUG}"
          TITLE="Canary ${GITHUB_REF_NAME}"
          NOTES="Branch canary for ${GITHUB_REF_NAME} at ${SHORT_SHA}. Install with the branch installer and \`--version ${TAG}\`. This prerelease also includes demo transcripts and terminal SVG previews."
          mapfile -t RELEASE_FILES < <(node ./scripts/collect-release-assets.mjs)

          if [ "${#RELEASE_FILES[@]}" -eq 0 ]; then
            echo "No release files were found in artifacts/release"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            mapfile -t EXISTING_ASSETS < <(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)

            for existing in "${EXISTING_ASSETS[@]}"; do
              keep=false
              for release_file in "${RELEASE_FILES[@]}"; do
                if [ "$existing" = "$(basename "$release_file")" ]; then
                  keep=true
                  break
                fi
              done

              if [ "$keep" = false ]; then
                gh release delete-asset "$TAG" "$existing" -y
              fi
            done

            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
            gh release upload "$TAG" "${RELEASE_FILES[@]}" --clobber
          else
            gh release create "$TAG" "${RELEASE_FILES[@]}" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi
  verify-prerelease-install:
    needs: canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Smoke test hosted prerelease installer
        run: |
          BRANCH_SLUG=$(printf "%s" "$GITHUB_REF_NAME" | tr '/_' '-' | tr -cd '[:alnum:]-')
          TAG="canary-${BRANCH_SLUG}"
          sh ./scripts/test-install-github-release.sh --version "$TAG"
      - name: Verify prerelease demo assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_SLUG=$(printf "%s" "$GITHUB_REF_NAME" | tr '/_' '-' | tr -cd '[:alnum:]-')
          TAG="canary-${BRANCH_SLUG}"
          node ./scripts/assert-release-demo-assets.mjs --tag "$TAG" --repo "$GITHUB_REPOSITORY"
      - name: Sync Homebrew formula
        if: github.ref_name != 'dev'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_SYNC_TOKEN }}
        run: |
          BRANCH_SLUG=$(printf "%s" "$GITHUB_REF_NAME" | tr '/_' '-' | tr -cd '[:alnum:]-')
          TAG="canary-${BRANCH_SLUG}"
          gh workflow run sync-formula.yml --repo vana-com/homebrew-vana -f release_tag="$TAG"
